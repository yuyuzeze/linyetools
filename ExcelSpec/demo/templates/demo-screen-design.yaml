schema_version: "1.0"
template_id: demo-screen-design
version: "1.0"
name: 画面設計書デモ
match:
  sheet_name_patterns: ["^表紙$", "^修正履歴$", "^画面入出力項目一覧$", "^画面アクション一覧$"]
  fingerprints:
    - sheet_name_pattern: "^表紙$"
      required_text: ["画面設計書", "SCR-A0010"]
    - sheet_name_pattern: "^画面入出力項目一覧$"
      required_text: ["項目名称", "データ元"]
  minimum_score: 0.55
sheets:
  - sheet_id: cover
    name_pattern: "^表紙$"
    order: 10
    regions:
      - region_id: document-info
        region_type: key_value
        title: 表紙
        required: true
        locator: {mode: fixed, range: "D11:I14"}
        extractor:
          kind: key_value
          key_column: 1
          value_column: 3
          key_semantics:
            文書番号: document_no
            バージョン: version
            作成者: author
            作成日: created_at
  - sheet_id: revisions
    name_pattern: "^修正履歴$"
    order: 20
    regions:
      - region_id: revision-table
        region_type: table
        title: 修正履歴
        locator:
          mode: anchor
          anchor_text: "No."
          width: 7
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            'No.': seq_no
            版数: revision
            シート: sheet_name
            修正箇所: location
            修正内容: change
            修正者: author
            修正日: changed_at
          options: {stop_after_blank_rows: 1, shrink_to_content: true, trim_empty_columns: true}
  - sheet_id: layout
    name_pattern: "^画面レイアウト$"
    order: 30
    regions:
      - region_id: screen-layout
        region_type: layout
        title: 画面レイアウト
        locator:
          mode: anchor
          anchor_pattern: "^■画面イメージ"
          row_offset: 1
          height: 20
          width: 8
        extractor: {kind: asset}
  - sheet_id: io-items
    name_pattern: "^画面入出力項目一覧$"
    order: 40
    regions:
      - region_id: io-table
        region_type: table
        title: 画面入出力項目一覧
        required: true
        locator:
          mode: anchor
          anchor_text: "No."
          width: 13
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            'No.': seq_no
            項目名称: field_name
            種別: control_type
            全半角: charset
            桁数: length
            "I/O": io
            表示: visible
            活性: enabled
            必須: required
            データ元: data_source
            初期値: default_value
            イベントID: event_id
            補足説明: remarks
          options: {stop_after_blank_rows: 1, shrink_to_content: true, trim_empty_columns: true}
  - sheet_id: actions
    name_pattern: "^画面アクション一覧$"
    order: 50
    regions:
      - region_id: action-table
        region_type: table
        title: 画面アクション一覧
        locator:
          mode: anchor
          anchor_text: "No."
          width: 7
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            'No.': seq_no
            イベントID: event_id
            イベント名: event_name
            画面項目名: field_name
            種別: control_type
            トリガー: trigger
            イベント概要: overview
          options: {stop_after_blank_rows: 1, shrink_to_content: true, trim_empty_columns: true}
  - sheet_id: checks
    name_pattern: "^入力チェック$"
    order: 60
    regions:
      - region_id: check-table
        region_type: table
        title: 入力チェック
        locator:
          mode: anchor
          anchor_text: "No."
          width: 5
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            'No.': seq_no
            項目名称: field_name
            チェック内容: validation
            エラーメッセージ: error_message
            イベントID: event_id
          options: {stop_after_blank_rows: 1, shrink_to_content: true, trim_empty_columns: true}
validation_rules: []
metadata:
  document_kind: screen-design
  demo: true
