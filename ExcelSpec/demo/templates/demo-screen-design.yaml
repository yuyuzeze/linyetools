schema_version: "1.0"
template_id: demo-screen-design
version: "1.0"
name: 画面設計書デモ
description: |
  OKI/林業系画面設計書（SCR-Axxxx）六シート構成向け。
  方眼レイアウトでは表の物理列が広いため、locator に width を固定せず
  trim_empty_columns / stop_after_blank_rows で実データ幅に縮める。
match:
  sheet_name_patterns:
    - "^表紙$"
    - "^修正履歴$"
    - "^画面レイアウト$"
    - "^画面入出力項目一覧$"
    - "^画面アクション一覧$"
    - "^入力チェック$"
  fingerprints:
    - sheet_name_pattern: "^表紙$"
      required_text: ["画面設計書"]
      weight: 1.0
    - sheet_name_pattern: "^画面入出力項目一覧$"
      required_text: ["No.", "画面項目名", "データ元"]
      weight: 1.2
    - sheet_name_pattern: "^画面アクション一覧$"
      required_text: ["イベントID", "トリガー"]
      weight: 1.0
    - sheet_name_pattern: "^入力チェック$"
      required_text: ["チェック内容", "メッセージID"]
      weight: 1.0
  minimum_score: 0.55
sheets:
  - sheet_id: cover
    name_pattern: "^表紙$"
    order: 10
    regions:
      - region_id: cover-title
        region_type: table
        title: 表紙タイトル
        locator:
          mode: fixed
          range: "E4:E9"
        extractor:
          kind: table
          header_rows: 0
          column_semantics:
            E: cover_text
          options:
            stop_after_blank_rows: 2
            shrink_to_content: true
      - region_id: document-info
        region_type: key_value
        title: 表紙
        required: true
        locator:
          mode: fixed
          range: "R11:Z14"
        extractor:
          kind: key_value
          key_column: 1
          # Labels are R11:R14; values/formulas are Z11:Z14.
          value_column: 9
          key_semantics:
            文書番号: document_no
            バージョン: version
            作成者: author
            作成日: created_at
            画面ID: screen_id
            画面名: screen_name
          options:
            shrink_to_content: true

  - sheet_id: revisions
    name_pattern: "^修正履歴$"
    order: 20
    regions:
      - region_id: ignored-sheet-header
        region_type: freeform
        order: 0
        locator: {mode: fixed, range: "A1:XFD4"}
        extractor:
          kind: freeform
          options: {ignore: true}
      # The header contains several key/value pairs spread across graph-paper
      # columns. Do not guess a single key/value region: parse the reliable
      # revision table until exact header coordinates are supplied.
      - region_id: revision-table
        region_type: table
        title: 修正履歴
        required: true
        locator:
          mode: anchor
          anchor_text: "No."
          # 方眼紙のため物理列が多い。幅はシート右端まで取り、後で trim。
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            "No\\.?": seq_no
            版数: revision
            シート: sheet_name
            修正箇所: location
            修正内容: change
            修正者: author
            修正日: changed_at
          options:
            stop_after_blank_rows: 2
            shrink_to_content: true
            trim_empty_columns: true

  - sheet_id: layout
    name_pattern: "^画面レイアウト$"
    order: 30
    regions:
      - region_id: ignored-sheet-header
        region_type: freeform
        order: 0
        locator: {mode: fixed, range: "A1:XFD4"}
        extractor:
          kind: freeform
          options: {ignore: true}
      - region_id: screen-layout
        region_type: layout
        title: 画面レイアウト
        locator:
          mode: anchor
          # Do not pin a short height: mockup images often sit far below the
          # label, and unbound images would otherwise fall into 「资源」.
          anchor_pattern: "^(■画面イメージ|画面イメージ|画面レイアウト)$"
          row_offset: 1
        extractor:
          kind: asset

  - sheet_id: io-items
    name_pattern: "^画面入出力項目一覧$"
    order: 40
    regions:
      - region_id: ignored-sheet-header
        region_type: freeform
        order: 0
        locator: {mode: fixed, range: "A1:XFD4"}
        extractor:
          kind: freeform
          options: {ignore: true}
      # 凡例 is cell-drawn (not an embedded picture). Capture a fixed-area
      # Pillow screenshot so MD/HTML can show it as an image.
      - region_id: legend
        region_type: image
        title: 凡例
        order: 1
        locator:
          mode: anchor
          anchor_pattern: "^■?凡例"
          height: 8
          width: 40
        extractor:
          kind: freeform
          options:
            screenshot: true
            shrink_to_content: true
      - region_id: io-table
        region_type: table
        title: 画面入出力項目一覧
        required: true
        locator:
          mode: anchor
          anchor_text: "No."
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            "^No\\.?$": seq_no
            "^(画面項目名|画面項目名称|項目名称)$": field_name
            "^種別$": control_type
            "^全半角$": charset
            "^桁数$": length
            "^I/O$": io
            "^(表示|表示中)$": visible
            "^活性$": enabled
            "^必須$": required
            "^データ元$": data_source
            "^初期値$": default_value
            "^イベントID$": event_id
            "^(補足説明|補足)$": remarks
          options:
            stop_after_blank_rows: 2
            shrink_to_content: true
            trim_empty_columns: true

  - sheet_id: actions
    name_pattern: "^画面アクション一覧$"
    order: 50
    regions:
      - region_id: ignored-sheet-header
        region_type: freeform
        order: 0
        locator: {mode: fixed, range: "A1:XFD4"}
        extractor:
          kind: freeform
          options: {ignore: true}
      - region_id: action-table
        region_type: table
        title: 画面アクション一覧
        required: true
        locator:
          mode: anchor
          anchor_text: "No."
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            "^No\\.?$": seq_no
            "^イベントID$": event_id
            "^イベント名$": event_name
            "^(画面項目名|画面項目名称|項目名称)$": field_name
            "^種別$": control_type
            "^トリガー$": trigger
            "^イベント概要$": overview
          options:
            stop_after_blank_rows: 2
            shrink_to_content: true
            trim_empty_columns: true

  - sheet_id: checks
    name_pattern: "^入力チェック$"
    order: 60
    regions:
      - region_id: ignored-sheet-header
        region_type: freeform
        order: 0
        locator: {mode: fixed, range: "A1:XFD4"}
        extractor:
          kind: freeform
          options: {ignore: true}
      - region_id: check-table
        region_type: table
        title: 入力チェック
        required: true
        locator:
          mode: anchor
          anchor_text: "No."
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            "^No\\.?$": seq_no
            "^イベントID$": event_id
            "^イベント名$": event_name
            "^(画面項目名|画面項目名称|項目名称)$": field_name
            "^チェック方法$": check_method
            "^チェック内容.*$": check_content
            "^メッセージID$": message_id
            "^パラメータ$": parameters
            "^(規定説明|判定説明|エラーメッセージ)$": message_text
          options:
            stop_after_blank_rows: 2
            shrink_to_content: true
            trim_empty_columns: true

validation_rules: []
metadata:
  language: ja-JP
  document_kind: screen-design
  sheet_count: 6
  demo: true
  export:
    clean: true
