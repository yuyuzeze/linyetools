schema_version: "1.0"
template_id: linye-screen-design-6sheet
version: "1.1"
name: 画面設計書（表紙+修正履歴+レイアウト+入出力+アクション+入力チェック）
description: |
  OKI/林業系 SCR-Axxxx 画面設計書の六シート構成向け。
  方眼紙の物理列位置には依存せず、業務ラベルと表頭をアンカーとして抽出する。
  表紙と各シートの共通ヘッダーは、ラベルから同じ行の次の非空セルを値として読む。
match:
  sheet_name_patterns:
    - "^表紙$"
    - "^修正履歴$"
    - "^画面レイアウト$"
    - "^画面入出力項目一覧$"
    - "^画面アクション一覧$"
    - "^入力チェック$"
  fingerprints:
    - sheet_name_pattern: "^表紙$"
      required_text: ["画面設計書", "文書番号", "バージョン"]
      weight: 1.2
    - sheet_name_pattern: "^修正履歴$"
      required_text: ["版数", "修正内容", "修正日"]
      weight: 1.0
    - sheet_name_pattern: "^画面入出力項目一覧$"
      required_text: ["No.", "画面項目名", "データ元"]
      weight: 1.2
    - sheet_name_pattern: "^画面アクション一覧$"
      required_text: ["イベントID", "トリガー", "イベント概要"]
      weight: 1.0
    - sheet_name_pattern: "^入力チェック$"
      required_text: ["チェック内容", "メッセージID"]
      weight: 1.0
  minimum_score: 0.55

sheets:
  - sheet_id: cover
    name_pattern: "^表紙$"
    order: 10
    regions:
      - region_id: cover-title
        region_type: freeform
        title: ""
        order: 0
        locator:
          mode: fixed
          range: "A1:XFD9"
        extractor:
          kind: freeform
          options:
            shrink_to_content: true
            trim_empty_columns: true

      - region_id: document-info
        region_type: key_value
        title: 文書情報
        order: 10
        required: true
        locator:
          mode: anchor
          anchor_text: "文書番号"
          height: 4
        extractor:
          kind: key_value
          key_semantics:
            文書番号: document_no
            バージョン: version
            作成者: author
            作成日: created_at
          options:
            scan_labels: true
            value_mode: next_nonblank
            shrink_to_content: true

  - sheet_id: revisions
    name_pattern: "^修正履歴$"
    order: 20
    regions:
      - &common_header
        region_id: sheet-header
        region_type: key_value
        title: 基本情報
        order: 0
        locator:
          mode: anchor
          anchor_text: "基本設計"
          height: 4
        extractor:
          kind: key_value
          key_semantics:
            プロダクト: product_name
            サブシステム: subsystem_name
            機能名: function_name
            画面名: screen_name
            画面ID: screen_id
            作成日: created_at
            更新日: updated_at
            作成者: author
            更新者: updated_by
          options:
            scan_labels: true
            value_mode: next_nonblank

      - region_id: revision-table
        region_type: table
        title: 修正履歴
        order: 10
        required: true
        locator:
          mode: anchor
          anchor_pattern: "^(No\\.?|№)$"
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            "^(No\\.?|№)$": seq_no
            "^版数$": revision
            "^シート$": sheet_name
            "^修正箇所$": location
            "^修正内容$": change
            "^修正者$": author
            "^修正日$": changed_at
          options:
            auto_header_rows: true
            stop_after_blank_rows: 2
            shrink_to_content: true
            trim_empty_columns: true

  - sheet_id: layout
    name_pattern: "^画面レイアウト$"
    order: 30
    regions:
      - <<: *common_header
        region_id: sheet-header

      - region_id: screen-layout
        region_type: layout
        title: 画面イメージ
        order: 10
        required: true
        locator:
          mode: anchor
          anchor_pattern: "^\\s*■?\\s*画面イメージ\\s*$"
          row_offset: 1
        extractor:
          kind: asset

  - sheet_id: io-items
    name_pattern: "^画面入出力項目一覧$"
    order: 40
    regions:
      - <<: *common_header
        region_id: sheet-header

      - region_id: ignored-section-heading
        region_type: freeform
        order: 1
        locator:
          mode: anchor
          anchor_pattern: "^\\s*■?\\s*画面入出力項目一覧\\s*$"
          height: 1
          repeat_anchor: true
        extractor:
          kind: freeform
          options:
            ignore: true

      - region_id: legend
        region_type: image
        title: 凡例
        order: 2
        locator:
          mode: anchor
          anchor_pattern: "^\\s*■?\\s*凡例"
          end_anchor_pattern: "^(No\\.?|№)$"
        extractor:
          kind: freeform
          options:
            screenshot: true
            screenshot_engine: excel_com
            screenshot_bounds: connected_region
            padding_rows: 1
            padding_columns: 1
            text_fallback: true
            shrink_to_content: true
            trim_empty_columns: true

      - region_id: io-table
        region_type: table
        title: 画面入出力項目一覧
        order: 10
        required: true
        locator:
          mode: anchor
          anchor_pattern: "^(No\\.?|№)$"
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            "^(No\\.?|№)$": seq_no
            "^(画面項目名|画面項目名称|項目名|項目名称)$": field_name
            "^種別$": control_type
            "^全半角$": charset
            "^桁数$": length
            "^I/O$": io
            "^(表示|表示中)$": visible
            "^活性$": enabled
            "^必須$": required
            "^データ元$": data_source
            "^初期値$": default_value
            "^イベントID$": event_id
            "^(補足説明|補足)$": remarks
          options:
            auto_header_rows: true
            stop_after_blank_rows: 2
            shrink_to_content: true
            trim_empty_columns: true

  - sheet_id: actions
    name_pattern: "^画面アクション一覧$"
    order: 50
    regions:
      - <<: *common_header
        region_id: sheet-header

      - region_id: ignored-section-heading
        region_type: freeform
        order: 1
        locator:
          mode: anchor
          anchor_pattern: "^\\s*■?\\s*画面アクション一覧\\s*$"
          height: 1
          repeat_anchor: true
        extractor:
          kind: freeform
          options:
            ignore: true

      - region_id: action-table
        region_type: table
        title: 画面アクション一覧
        order: 10
        required: true
        locator:
          mode: anchor
          anchor_pattern: "^(No\\.?|№|Z|Ｚ)$"
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            "^(No\\.?|№|Z|Ｚ)$": seq_no
            "^イベントID$": event_id
            "^イベント名$": event_name
            "^(画面項目名|画面項目名称|項目名|項目名称)$": field_name
            "^種別$": control_type
            "^トリガー$": trigger
            "^イベント概要$": overview
          options:
            auto_header_rows: true
            stop_after_blank_rows: 2
            shrink_to_content: true
            trim_empty_columns: true

  - sheet_id: checks
    name_pattern: "^入力チェック$"
    order: 60
    regions:
      - <<: *common_header
        region_id: sheet-header

      - region_id: check-table
        region_type: table
        title: 入力チェック
        order: 10
        required: true
        locator:
          mode: anchor
          anchor_pattern: "^(No\\.?|№)$"
        extractor:
          kind: table
          header_rows: 1
          column_semantics:
            "^(No\\.?|№)$": seq_no
            "^イベントID$": event_id
            "^イベント名$": event_name
            "^(画面項目名|画面項目名称|項目名|項目名称)$": field_name
            "^種別$": control_type
            "^チェック方法$": check_method
            "^チェック内容.*$": check_content
            "^メッセージID$": message_id
            "^パラメータ$": parameters
            "^(補足説明|補足|規定説明|判定説明|エラーメッセージ)$": message_text
          options:
            auto_header_rows: true
            stop_after_blank_rows: 2
            shrink_to_content: true
            trim_empty_columns: true

validation_rules: []
metadata:
  language: ja-JP
  document_kind: screen-design
  sheet_count: 6
  layout_family: graph-paper
  screenshot_policy: embedded-assets-first
  export:
    clean: true
